# Replace <agent-domain> with the agent's domain everywhere below.
# Change 127.0.0.1:8090 in ProxyPass and ProxyPassReverse if DB Agent listens elsewhere.
<VirtualHost *:80>
    ServerName <agent-domain>
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName <agent-domain>

    AllowEncodedSlashes NoDecode
    Protocols h2 http/1.1

    ErrorLog  /var/log/apache2/calagopus-db-agent.error.log
    CustomLog /var/log/apache2/calagopus-db-agent.access.log combined

    EnableSendfile Off
    # Leave at 0: database imports arrive as one streamed request.
    LimitRequestBody 0
    ProxyTimeout 3600

    SSLEngine on
    # The paths certbot creates. Change them if your certificate lives elsewhere.
    SSLCertificateFile    /etc/letsencrypt/live/<agent-domain>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<agent-domain>/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy        "same-origin"

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # upgrade=websocket needs Apache 2.4.47 or newer; see the note below for older releases.
    ProxyPass        / http://127.0.0.1:8090/ retry=0 upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8090/

    # Tell DB Agent who the client is. mod_proxy adds X-Forwarded-For on its own.
    RequestHeader set X-Real-IP        %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
