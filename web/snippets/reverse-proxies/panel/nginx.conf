# Replace <domain> with your domain everywhere below.
# Change the address in the upstream if the Panel doesn't listen on 127.0.0.1:8000.
upstream calagopus {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <domain>;

    access_log /var/log/nginx/calagopus.app-access.log;
    error_log  /var/log/nginx/calagopus.app-error.log error;

    sendfile off;
    # Largest request body the proxy accepts. Uploads bigger than this fail with HTTP 413.
    client_max_body_size 128M;

    add_header X-XSS-Protection   "1; mode=block";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self), clipboard-read=(self)" always;
    add_header Referrer-Policy    "same-origin";

    proxy_http_version 1.1;
    # WebSocket support (uses the map from step 1)
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # Tell the Panel who the visitor is
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location / {
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_pass http://calagopus;
    }

    # Wings traffic relayed by the Panel (AiO, Wings Proxy Mode)
    location /wings-proxy/ {
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout       3600s;
        proxy_pass http://calagopus;
    }

    # Backup requests from Wings
    location /api/remote/backups/ {
        gzip off;
        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout       3600s;
        proxy_pass http://calagopus;
    }

    location ~ /\.ht {
        deny all;
    }
}
