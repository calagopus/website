# Replace <domain> with your domain everywhere below.
# Change 127.0.0.1:8000 in ProxyPass and ProxyPassReverse if the Panel listens elsewhere.
<VirtualHost *:80>
    ServerName <domain>

    AllowEncodedSlashes NoDecode

    ErrorLog  /var/log/apache2/calagopus.app-error.log
    CustomLog /var/log/apache2/calagopus.app-access.log combined

    EnableSendfile Off
    # In bytes; 134217728 = 128 MiB, 0 for no limit
    LimitRequestBody 134217728
    ProxyTimeout 3600

    Header always set X-XSS-Protection   "1; mode=block"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self), clipboard-read=(self)"
    Header always set Referrer-Policy    "same-origin"

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # upgrade=websocket needs Apache 2.4.47 or newer; see the note below for older releases.
    ProxyPass        / http://127.0.0.1:8000/ retry=0 upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8000/

    # Tell the Panel who the visitor is. mod_proxy adds X-Forwarded-For on its own.
    RequestHeader set X-Real-IP        %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "http"

    # Wings traffic relayed by the Panel (AiO, Wings Proxy Mode)
    <Location "/wings-proxy">
        LimitRequestBody 0
    </Location>

    # Backup requests from Wings
    <Location "/api/remote/backups">
        LimitRequestBody 0
    </Location>

    <FilesMatch "^\.ht">
        Require all denied
    </FilesMatch>
</VirtualHost>
