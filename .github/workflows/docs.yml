name: Deploy Docs to Cloudflare Workers

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          pnpm install

      - name: Run docs:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run docs:build

      - name: Check Worker route coverage
        run: |
          pnpm run check-worker-routes

      - name: Apply ClickHouse schema
        env:
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_DDL_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_DDL_PASSWORD }}
        run: |
          pnpm run apply-clickhouse-schema

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      - name: Sync docs into AI Search
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          pnpm run sync-ai-search

      - name: Wait for deployment to propagate
        run: sleep 60

      - name: Submit recently changed URLs to IndexNow
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          KEY = "c0b4e7b671f31efb78845322dce3f516"
          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          UA = "calagopus-indexnow/1.0 (+https://calagopus.com)"

          req = urllib.request.Request(
              "https://calagopus.com/sitemap.xml",
              headers={"User-Agent": UA},
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              tree = ET.fromstring(res.read())

          cutoff = datetime.now(timezone.utc) - timedelta(days=2)
          urls = []
          for url in tree.findall("sm:url", NS):
              loc = url.findtext("sm:loc", namespaces=NS)
              lastmod = url.findtext("sm:lastmod", namespaces=NS)
              if not loc or not lastmod:
                  continue
              if datetime.fromisoformat(lastmod.replace("Z", "+00:00")) >= cutoff:
                  urls.append(loc)

          if not urls:
              print("No URLs changed in the last 2 days - nothing to submit.")
              raise SystemExit(0)

          payload = json.dumps({
              "host": "calagopus.com",
              "key": KEY,
              "keyLocation": f"https://calagopus.com/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": UA,
              },
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              print(f"Submitted {len(urls)} URL(s), IndexNow responded {res.status}")
          EOF
